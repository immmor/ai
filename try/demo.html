<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background: #1e272e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }

    .erase-btn {
      position: relative;
      width: 140px;
      height: 48px;
      background: #ff5e57;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 橡皮擦道具 */
    .eraser {
      position: absolute;
      top: -10px;
      left: -40px;
      width: 30px;
      height: 70px;
      background: #f5f6fa;
      border-radius: 4px;
      box-shadow: -2px 0 5px rgba(0,0,0,0.2);
      transform: rotate(20deg);
      z-index: 3;
      opacity: 0;
    }

    /* 擦除黑层，覆盖原按钮 */
    .wipe-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #1e272e; /* 和背景色一致，制造擦除假象 */
      z-index: 2;
      width: 0%;
    }

    /* 触发擦除动画 */
    .erase-btn.erasing .eraser {
      opacity: 1;
      animation: eraseMotion 0.8s ease-in-out forwards;
    }

    .erase-btn.erasing .wipe-overlay {
      animation: wipeBackground 0.8s ease-in-out forwards;
    }

    @keyframes eraseMotion {
      0% { left: -30px; }
      30% { left: 40px; transform: rotate(10deg); }
      60% { left: 80px; transform: rotate(25deg); }
      100% { left: 150px; transform: rotate(10deg); }
    }

    @keyframes wipeBackground {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    .erase-btn.destroyed {
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

  <button class="erase-btn" onclick="eraseMe(this)">
    <span>抹去记录</span>
    <div class="wipe-overlay"></div>
    <div class="eraser"></div>
  </button>

  <script>
    function eraseMe(btn) {
      if (btn.classList.contains('erasing')) return;
      btn.classList.add('erasing');
      
      setTimeout(() => {
        btn.classList.add('destroyed');
      }, 800);
    }
  </script>

</body>
</html>
